---
name: Docker Build Check

# Build the image on PRs (no push) so a broken Dockerfile — most importantly
# the dict-bake layers that make the runtime self-contained/offline
# (open_jtalk_dic via pyopenjtalk, and the ~1.3 GB UniDic download in
# scripts/download_unidic.sh) — fails the PR instead of the release build.
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/download_unidic.sh"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: api-tools:pr-${{ github.event.pull_request.number || github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the accent pipeline in the built image
        run: |
          # Confirms the baked dictionaries resolve offline: run the
          # in-process OpenJTalk frontend with no network on the container.
          docker run --rm --network none \
            api-tools:pr-${{ github.event.pull_request.number || github.run_id }} \
            python -c "import pyopenjtalk; print(pyopenjtalk.extract_fullcontext('東京')[:1])"
