---
name: Docker Build Check

# Build the image on PRs (no push) so a broken Dockerfile — most importantly
# the dict-bake layers that make the runtime self-contained/offline
# (open_jtalk_dic via pyopenjtalk, and the UniDic dict — ~700 MB compressed
# download, ~1.3 GB installed — from scripts/download_unidic.sh) — fails the
# PR instead of the release build.
# The smoke-test step then runs the built image with `--network none` and
# exercises BOTH baked dictionaries: the OpenJTalk open_jtalk_dic (via
# pyopenjtalk) AND the fugashi/UniDic dicdir (via the tokeniser). A broken
# or missing download of either dict fails the gate offline.
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/download_unidic.sh"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: api-tools:pr-${{ github.event.pull_request.number || github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the accent pipeline in the built image
        run: |
          # Confirms BOTH baked dictionaries resolve offline, in one container
          # run: the OpenJTalk open_jtalk_dic (pyopenjtalk.extract_fullcontext)
          # AND the ~1.3 GB fugashi/UniDic dicdir (api.accent.tokenizer.
          # tag_local). WORKDIR is /app and the app modules are compiled to .pyc
          # there, so they import directly. Both run in one `python -c`, so an
          # ImportError / missing-dict on EITHER check raises and fails the job.
          #
          # Flags mirror the production hardening in compose.deploy.yml so a
          # regression that needs the network or a writable rootfs fails here:
          #   --network none    offline (both dicts must be baked in)
          #   --read-only       read-only rootfs (no runtime disk writes)
          #   --tmpfs /tmp      the one writable path the runtime is allowed
          docker run --rm --network none --read-only --tmpfs /tmp \
            -e PYTHONDONTWRITEBYTECODE=1 \
            api-tools:pr-${{ github.event.pull_request.number || github.run_id }} \
            python -c "import pyopenjtalk; print(pyopenjtalk.extract_fullcontext('東京')[:1]); from api.accent.tokenizer import tag_local; print(tag_local('東京')[:1])"
