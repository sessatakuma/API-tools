---
name: Tests

# Runs lint, type-check, and the unit test suite on every PR. The suite
# (tests/test_align.py, tests/test_fullcontext.py, tests/test_openjtalk.py)
# needs neither the ~1.3 GB UniDic dict nor the network for its dict: the
# align/fullcontext tests are pure Python, and the OpenJTalk tests use only
# pyopenjtalk's bundled open_jtalk_dic (~23 MB, fetched on first call). So this
# gate is fast and does NOT overlap the heavier offline docker-build check.
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.0"

      - name: Install build toolchain for pyopenjtalk
        # pyopenjtalk ships source-only and builds its bundled OpenJTalk/
        # HTS-engine C++ from sdist during `uv sync` (same as the Dockerfile).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy api

      - name: Pytest
        run: uv run pytest -q
